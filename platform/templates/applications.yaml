{{- range .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .repoURL | default "https://github.com/PeterLaudel/helm-deployment" }}
    targetRevision: {{ .targetRevision | default "HEAD" }}
    path: platform/{{ .name }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace | default .name }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
{{- end }}
