{{- range .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  {{- if .syncWave }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
  {{- end }}
spec:
  project: default
  source:
    repoURL: {{ .repoURL | default "https://github.com/PeterLaudel/helm-deployment" }}
    targetRevision: {{ .targetRevision | default "HEAD" }}
    path: platform/{{ .name }}
  destination:
    server: https://kubernetes.default.svc
    {{- if .namespace }}
    namespace: {{ .namespace }}
    {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
{{- end }}
